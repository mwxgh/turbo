# CI for the GitFlow branching model (mirrors .gitlab-ci.yml).
#
#   Trigger             Jobs
#   ------------------  ---------------------------------------------------------
#   pull request        gitflow (source → target allowed?) + check + e2e
#   develop             check → images (dev)
#   release/X.Y.Z       check → images (stg)
#   hotfix/X.Y.Z        check → images (stg)
#   main                check
#   tag vX.Y.Z on main  check → images (prod) tagged :prod :X.Y.Z :latest
#
# Images: ghcr.io/<owner>/<repo>-<app> for api, migrate, socket, web.
# Repository settings:
#   Environments dev / stg / prod (docs/process/environments.md) – variables PUBLIC_API_URL, PUBLIC_SOCKET_URL
#   (browser URLs baked into the web image). Add "Required reviewers" on prod to
#   make production builds a manual approval.

name: ci

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede outdated PR runs; never cancel branch/tag runs that publish images
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check source → target branch
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: sh scripts/gitflow-check.sh "$SOURCE" "$TARGET"

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=public
      REDIS_URL: redis://localhost:6379
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo task cache: unchanged packages are restored instead of rebuilt
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref_name }}-
            turbo-develop-

      - name: Format
        run: pnpm format:check

      - name: Build, lint, type-check, unit tests
        run: pnpm turbo run build lint check-types test --cache-dir=.turbo/cache

      - name: Migrations apply cleanly and match schema.prisma
        run: |
          pnpm db:deploy
          pnpm db:check

      - name: Backend e2e (api on <db>_test, socket)
        run: pnpm turbo run test:e2e --filter=api --filter=socket --filter=@repo/redis --cache-dir=.turbo/cache

  # Browser e2e: Playwright starts api, socket and web against Postgres + Redis
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=public
      REDIS_URL: redis://localhost:6379
      # Uploads are mocked in the browser test; the api only needs valid config
      STORAGE_CORE_S3_SERVERS: '[{"NAME":"default","CONFIG":{"ENDPOINT":"http://storage.test","KEY":"test","SECRET":"test-secret"}}]'
      STORAGE_BUCKET: test
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Builds of api/socket/web from earlier `check` runs (read-only here)
      - uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref_name }}-
            turbo-develop-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('apps/e2e/package.json') }}
      - run: pnpm db:deploy
      - run: pnpm --filter e2e install-browsers

      - name: Playwright
        run: pnpm turbo run test:e2e --filter=e2e --cache-dir=.turbo/cache

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  # Which environment (if any) this push publishes images for
  stage:
    needs: [check, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.stage.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: stage
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$REF" in
            refs/heads/develop) name=dev ;;
            refs/heads/release/* | refs/heads/hotfix/*)
              echo "$REF" | grep -Eq '^refs/heads/(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$' && name=stg || name="" ;;
            refs/tags/v*)
              echo "$REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Not a release tag"; exit 1; }
              git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
                echo "::error::${REF#refs/tags/} is not on $DEFAULT_BRANCH; tag releases after merging release/* or hotfix/*."
                exit 1
              }
              name=prod ;;
            *) name="" ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Stage: ${name:-<none>}"

  images:
    needs: stage
    if: needs.stage.outputs.name != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.stage.outputs.name }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { app: api, file: deploy/nest.Dockerfile, target: runner }
          - { app: migrate, file: deploy/nest.Dockerfile, target: migrate }
          - { app: socket, file: deploy/nest.Dockerfile, target: runner }
          - { app: web, file: deploy/web.Dockerfile, target: runner }
    env:
      STAGE: ${{ needs.stage.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=${{ env.STAGE }}
            type=sha
            type=semver,pattern={{version}},enable=${{ env.STAGE == 'prod' }}
            type=raw,value=latest,enable=${{ env.STAGE == 'prod' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          # migrate is built from the api workspace. NEXT_PUBLIC_* only matter for
          # web (inlined into the browser bundle); set them per environment.
          build-args: |
            APP=${{ matrix.app == 'migrate' && 'api' || matrix.app }}
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:4000/api' }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.PUBLIC_SOCKET_URL || 'http://localhost:4001' }}
            NEXT_PUBLIC_APP_ENV=${{ env.STAGE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ env.STAGE }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ env.STAGE }}
