# CI for the GitFlow branching model (mirrors .gitlab-ci.yml).
#
#   Trigger             Jobs
#   ------------------  ---------------------------------------------------------
#   pull request        gitflow (source → target allowed?) + check
#   (browser e2e / Playwright runs locally only: apps/e2e, ADR 0009)
#   develop             check → images (dev)
#   release/X.Y.Z       check → images (stg) → deploy (stg)
#   hotfix/X.Y.Z        check → images (stg) → deploy (stg)
#   main                check
#   tag vX.Y.Z on main  check → images (prod) tagged :prod :X.Y.Z :latest
#
# Images: ghcr.io/<owner>/<repo>-<app> for api, migrate, socket, web.
# Repository settings:
#   Environments dev / stg / prod (docs/process/environments.md) – variables PUBLIC_API_URL, PUBLIC_SOCKET_URL
#   (browser URLs baked into the web image). Add "Required reviewers" on prod to
#   make production builds a manual approval.
#   Auto deploy (optional, per Environment): variables DEPLOY_HOST (user@host) and
#   DEPLOY_KNOWN_HOSTS, secret DEPLOY_SSH_KEY. The server key runs a forced command
#   that receives only the image tag (docs/process/deploy.md). Unset → deploy is skipped.

name: ci

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede outdated PR runs; never cancel branch/tag runs that publish images
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # .turbo/cache is restored and saved again on every run: evict old entries
  TURBO_CACHE_MAX_AGE: 7d

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check source → target branch
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: sh scripts/gitflow-check.sh "$SOURCE" "$TARGET"

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=public
      REDIS_URL: redis://localhost:6379
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo task cache: unchanged packages are restored instead of rebuilt
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref_name }}-
            turbo-develop-

      - name: Format
        run: pnpm format:check

      - name: Type-check repo scripts, check workspace manifests
        run: pnpm check-types:scripts && pnpm lint:workspace

      - name: Build, lint, type-check, unit tests
        run: pnpm turbo run build lint check-types test

      - name: Migrations apply cleanly and match schema.prisma
        run: |
          pnpm db:deploy
          pnpm db:check

      - name: Backend e2e (api on <db>_test, socket)
        run: pnpm turbo run test:e2e --filter=api --filter=socket --filter=@repo/redis

  # Which environment (if any) this push publishes images for
  stage:
    needs: [check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.stage.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: stage
        env:
          REF: ${{ github.ref }}
          # Production branch (GitFlow): not the repo default branch, which is develop
          RELEASE_BRANCH: main
        run: |
          case "$REF" in
            refs/heads/develop) name=dev ;;
            refs/heads/release/* | refs/heads/hotfix/*)
              echo "$REF" | grep -Eq '^refs/heads/(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$' && name=stg || name="" ;;
            refs/tags/v*)
              echo "$REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Not a release tag"; exit 1; }
              git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH" || {
                echo "::error::${REF#refs/tags/} is not on $RELEASE_BRANCH; tag releases after merging release/* or hotfix/*."
                exit 1
              }
              name=prod ;;
            *) name="" ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Stage: ${name:-<none>}"

  images:
    needs: stage
    if: needs.stage.outputs.name != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.stage.outputs.name }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { app: api, file: deploy/nest.Dockerfile, target: runner }
          - { app: migrate, file: deploy/nest.Dockerfile, target: migrate }
          - { app: socket, file: deploy/nest.Dockerfile, target: runner }
          - { app: web, file: deploy/web.Dockerfile, target: runner }
    env:
      STAGE: ${{ needs.stage.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=${{ env.STAGE }}
            # env in the sha tag: develop and release/* can build the same commit
            type=sha,prefix=${{ env.STAGE }}-sha-
            type=semver,pattern={{version}},enable=${{ env.STAGE == 'prod' }}
            type=raw,value=latest,enable=${{ env.STAGE == 'prod' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          # migrate is built from the api workspace. NEXT_PUBLIC_* only matter for web;
          # required on stg/prod (the web build fails if missing or localhost), dev
          # falls back to localhost. Set PUBLIC_* per GitHub Environment.
          build-args: |
            APP=${{ matrix.app == 'migrate' && 'api' || matrix.app }}
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_APP_ENV=${{ env.STAGE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ env.STAGE }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ env.STAGE }}

  # Roll the freshly pushed images out to the stage's server (skipped when the
  # Environment has no DEPLOY_HOST / DEPLOY_SSH_KEY). The SSH key is restricted on
  # the server to a deploy script, which only accepts the image tag.
  deploy:
    needs: [stage, images]
    if: needs.stage.outputs.name != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.stage.outputs.name }}
    env:
      STAGE: ${{ needs.stage.outputs.name }}
    concurrency:
      group: deploy-${{ needs.stage.outputs.name }}
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "No DEPLOY_HOST / DEPLOY_KNOWN_HOSTS / DEPLOY_SSH_KEY on this environment: skipping deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          TAG="${STAGE}-sha-${GITHUB_SHA::7}"
          echo "Deploying $TAG to ${HOST#*@}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$HOST" "$TAG"
