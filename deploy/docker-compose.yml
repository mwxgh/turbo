# Usage:
#   cp deploy/.env.example deploy/.env
#   pnpm infra:up     # PostgreSQL + Redis only (apps run on the host with `pnpm dev`)
#   pnpm stack:up     # + migrate, api, socket, web from the Dockerfiles (profile "app")

name: ${COMPOSE_PROJECT_NAME:-turbo-base}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    restart: ${RESTART_POLICY:-no}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - '${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker: mount the parent.
    # New volume name: a volume of an older major is never reused (upgrade = dump / restore).
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Shared by the backend apps (@repo/redis); keys are prefixed per APP_ENV
  redis:
    image: redis:${REDIS_VERSION:-8-alpine}
    restart: ${RESTART_POLICY:-no}
    # appendonly: keep data across restarts; noeviction (the default) never
    # drops keys silently – required if queues (BullMQ) are added later
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------- Apps (profile "app") ----------
  migrate:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/nest.Dockerfile
      args: { APP: api }
      target: migrate
    environment:
      DATABASE_URL: &database-url postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/nest.Dockerfile
      args: { APP: api }
    restart: ${RESTART_POLICY:-no}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      PORT: 3001
      DATABASE_URL: *database-url
      REDIS_URL: &redis-url redis://redis:6379
      # S3 / MinIO (btp format), from deploy/.env
      STORAGE_CORE_S3_SERVERS: ${STORAGE_CORE_S3_SERVERS}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      # Required by api / socket (their env validation fails without it); not by `pnpm infra:up`
      JWT_SECRET: &jwt-secret ${JWT_SECRET:-}
      AUTH_REGISTRATION: ${AUTH_REGISTRATION:-closed}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Sign-in with providers (empty id/secret = provider off)
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001/api}
      WEB_URL: ${WEB_ORIGIN:-http://localhost:3000}
      OAUTH_MOBILE_REDIRECT_URIS: ${OAUTH_MOBILE_REDIRECT_URIS:-turbobase://oauth}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
    ports:
      - '${APP_BIND:-127.0.0.1}:${API_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  socket:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/nest.Dockerfile
      args: { APP: socket }
    restart: ${RESTART_POLICY:-no}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      PORT: 3002
      REDIS_URL: *redis-url
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_SECRET: *jwt-secret
    ports:
      - '${APP_BIND:-127.0.0.1}:${SOCKET_PORT:-3002}:3002'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/socket/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Browser-facing URLs, inlined at build time
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001/api}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:3002}
        NEXT_PUBLIC_APP_ENV: ${APP_ENV:-dev}
    restart: ${RESTART_POLICY:-no}
    environment:
      # Server-side calls stay inside the Docker network
      API_URL: http://api:3001/api
    ports:
      - '${APP_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres18-data:
  redis-data:
