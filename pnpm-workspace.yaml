packages:
  - 'apps/*'
  - 'packages/*'

# Named catalogs: reference with `"<pkg>": "catalog:<name>"`.
catalogs:
  # Dev tooling shared by every workspace.
  tooling:
    # TS 7 has no compiler API yet (needed by Nest CLI, typescript-eslint, @nestjs/swagger).
    'typescript': 6.0.3
    'eslint': 10.9.1
    '@types/node': 26.4.1
    'tsx': 4.23.15
    'vitest': 5.0.5
    '@vitest/coverage-v8': 5.0.5

  nestjs:
    '@nestjs/common': 12.2.0
    '@nestjs/core': 12.2.0
    '@nestjs/platform-express': 12.2.0
    '@nestjs/platform-socket.io': 12.2.0
    '@nestjs/websockets': 12.2.0
    '@nestjs/swagger': 12.0.2
    '@nestjs/cli': 12.0.9
    '@nestjs/schematics': 12.0.9
    'class-transformer': 0.5.1
    'class-validator': 0.15.1
    'reflect-metadata': 0.2.2
    '@nestjs/testing': 12.2.0
    'rxjs': 7.8.2

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  'esbuild': true
  'prisma': true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.72.0'
  - '@typescript-eslint/parser@8.72.0'
  - '@typescript-eslint/project-service@8.72.0'
  - '@typescript-eslint/scope-manager@8.72.0'
  - '@typescript-eslint/tsconfig-utils@8.72.0'
  - '@typescript-eslint/type-utils@8.72.0'
  - '@typescript-eslint/types@8.72.0'
  - '@typescript-eslint/typescript-estree@8.72.0'
  - '@typescript-eslint/utils@8.72.0'
  - '@typescript-eslint/visitor-keys@8.72.0'
  - typescript-eslint@8.72.0
  - '@nestjs/cli@12.0.9'
  - '@nestjs/schematics@12.0.9'
