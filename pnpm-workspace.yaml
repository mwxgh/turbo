packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/tooling/*'

# Shared versions: one flat list, referenced as `"<pkg>": "catalog:"`.
catalog:
  # Dev tooling (TS 7 has no compiler API yet: Nest CLI, typescript-eslint, @nestjs/swagger need it)
  'typescript': 6.0.3
  'eslint': 10.9.1
  # Prettier: root (repo format) and @repo/scaffold (formats generated projects)
  'prettier': 3.9.6
  '@trivago/prettier-plugin-sort-imports': 6.0.2
  'prettier-plugin-sort-json': 4.2.0
  '@types/node': 26.4.1
  'tsx': 4.23.15
  'vitest': 5.0.5
  '@vitest/coverage-v8': 5.0.5
  '@swc/core': 1.16.18
  '@swc/cli': 0.8.1
  'globals': 17.12.0
  'turbo': 2.11.9
  '@turbo/gen': 2.11.9
  'eslint-plugin-turbo': 2.11.9

  # NestJS: all @nestjs/* move together
  '@nestjs/common': 12.3.2
  '@nestjs/core': 12.3.2
  '@nestjs/platform-express': 12.3.2
  '@nestjs/platform-socket.io': 12.3.2
  '@nestjs/websockets': 12.3.2
  '@nestjs/swagger': 12.0.2
  '@nestjs/cli': 12.0.9
  '@nestjs/schematics': 12.0.9
  '@nestjs/testing': 12.3.2
  '@nestjs/throttler': 6.7.1
  'class-transformer': 0.5.1
  'class-validator': 0.15.1
  'reflect-metadata': 0.2.2
  'rxjs': 7.8.2

  # Logging (@repo/nest-common/logger): nestjs-pino pins the pino / pino-http majors
  'nestjs-pino': 5.3.1
  'pino': 10.4.0
  'pino-http': 11.0.0
  'pino-pretty': 13.2.0

  # Prisma: client, CLI, adapter and generator helper move together
  # (dotenv: loads .env for prisma.config.ts and seed.ts)
  'prisma': 7.10.1
  '@prisma/client': 7.10.1
  '@prisma/adapter-pg': 7.10.1
  '@prisma/generator-helper': 7.10.1
  'dotenv': 18.0.8

  # React: one version for web, ui and mobile (Expo SDK 58 pins 19.3.0)
  'react': 19.3.0
  'react-dom': 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Next and its lint plugin move together
  'next': 16.4.1
  '@next/eslint-plugin-next': 16.4.1

  # Tailwind v4 for web, ui and mobile (NativeWind 5)
  'tailwindcss': 4.3.3
  '@tailwindcss/postcss': 4.3.3

  # TanStack
  '@tanstack/react-query': 5.104.4
  '@tanstack/react-query-devtools': 5.104.4
  '@tanstack/react-form': 1.33.5

  # UI and realtime libs shared by several workspaces
  'date-fns': 4.4.0
  'lucide-react': 1.59.0
  'next-themes': 0.4.6
  'nuqs': 2.10.2
  'socket.io': 4.8.4
  'socket.io-client': 4.8.4

  # Unit tests of React code (web, ui)
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  'jsdom': 30.1.3

overrides:
  # NativeWind 5 (react-native-css) round-trips the stylesheet through lightningcss;
  # 1.31+ fails on var() ("failed to deserialize … Specifier"). Drop once fixed upstream.
  '@expo/metro-config>lightningcss': 1.30.1
  # Security (GHSA in body-parser <2.4.0): express 5.3 still allows ^2.3.0. Drop once
  # express requires >=2.4.0.
  'express>body-parser': ^2.4.0

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  'esbuild': true
  'prisma': true
