packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/tooling/*'

# Shared versions: one flat list, referenced as `"<pkg>": "catalog:"`.
catalog:
  # Dev tooling (TS 7 has no compiler API yet: Nest CLI, typescript-eslint, @nestjs/swagger need it)
  'typescript': 6.0.3
  'eslint': 10.15.0
  # Prettier: root (repo format) and api (Studio formats generated projects)
  'prettier': 3.9.6
  '@trivago/prettier-plugin-sort-imports': 6.0.2
  'prettier-plugin-sort-json': 4.2.0
  # Studio downloads (api zips generated projects)
  'jszip': 3.10.2
  # Lingo (api): item / CSV validation and spaced repetition
  'zod': 4.6.7
  'ts-fsrs': 5.4.2
  '@types/node': 26.4.1
  'tsx': 4.23.15
  'vitest': 5.0.5
  '@vitest/coverage-v8': 5.0.5
  '@swc/core': 1.16.18
  '@swc/cli': 0.8.1
  'globals': 17.12.0
  'turbo': 2.11.9
  '@turbo/gen': 2.11.9
  'eslint-plugin-turbo': 2.11.9

  # NestJS: all @nestjs/* move together
  '@nestjs/common': 12.3.2
  '@nestjs/core': 12.3.2
  '@nestjs/platform-express': 12.3.2
  '@nestjs/platform-socket.io': 12.3.2
  '@nestjs/websockets': 12.3.2
  '@nestjs/swagger': 12.0.2
  '@nestjs/cli': 12.0.15
  '@nestjs/schematics': 12.0.9
  '@nestjs/testing': 12.3.2
  '@nestjs/throttler': 6.7.1
  'class-transformer': 0.5.1
  'class-validator': 0.15.1
  'reflect-metadata': 0.2.2
  'rxjs': 7.8.2

  # Logging (@repo/nest-common/logger): nestjs-pino pins the pino / pino-http majors
  'nestjs-pino': 5.3.1
  'pino': 10.4.0
  'pino-http': 11.0.0
  'pino-pretty': 13.2.0

  # Prisma: client, CLI, adapter and generator helper move together
  # (dotenv: loads .env for prisma.config.ts and seed.ts)
  'prisma': 7.10.1
  '@prisma/client': 7.10.1
  '@prisma/adapter-pg': 7.10.1
  '@prisma/generator-helper': 7.10.1
  'dotenv': 18.0.8

  # React: one version for web, ui and mobile (Expo SDK 58 pins 19.3.0)
  'react': 19.3.0
  'react-dom': 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Next and its lint plugin move together
  'next': 16.4.5
  '@next/eslint-plugin-next': 16.4.5

  # Tailwind v4 for web, ui and mobile (NativeWind 5)
  'tailwindcss': 4.3.3
  '@tailwindcss/postcss': 4.3.3

  # TanStack
  '@tanstack/react-query': 5.104.4
  '@tanstack/react-query-devtools': 5.104.4
  '@tanstack/react-form': 1.33.5

  # UI and realtime libs shared by several workspaces
  'date-fns': 4.4.0
  'motion': 14.11.1
  'nuqs': 2.10.2
  'pulsoicon-react': 6.2.0
  'socket.io': 4.8.4
  'socket.io-client': 4.8.4

  # Unit tests of React code (web, ui)
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  'jsdom': 30.1.3

# Every override is pinned by hand: list it in renovate.json5 ("Overrides … pinned by hand") too
overrides:
  # NativeWind 5 (react-native-css) round-trips the stylesheet through lightningcss;
  # 1.31+ fails on var() ("failed to deserialize … Specifier"). Drop once fixed upstream.
  '@expo/metro-config>lightningcss': 1.30.1
  # Security (GHSA in body-parser <2.4.0): express 5.3 still allows ^2.3.0. Drop once
  # express requires >=2.4.0.
  'express>body-parser': ^2.4.0
  # Security (pnpm audit, 2026-11-23): patched versions inside the ranges the parents allow.
  # Drop each one once the parent's own range excludes the vulnerable versions.
  'flat-cache>flatted': ^3.4.2
  'picomatch@^2': ^2.3.2
  '@humanfs/node': ^0.16.8
  'node-forge@^1': ^1.4.3
  'ajv>fast-uri': ^3.1.9
  '@hono/node-server': ^2.1.6
  'hono': ^4.13.16
  # Prisma pins effect 3.20.0 (ReDoS fixed in 3.22.1, same major)
  '@prisma/config>effect': ^3.22.1
  # minimatch ^9 has a ReDoS fixed only in 11; both callers use the unchanged `minimatch()` API
  '@trivago/prettier-plugin-sort-imports>minimatch': ^11.0.1
  '@swc/cli>minimatch': ^11.0.1
  # Not fixable here: the Expo SDK's CLI pins zod ^3 and glob ^13 (with minimatch ^10); fixes only
  # in zod 4 / glob 14 / minimatch 11.
  # Dev-time tooling, not shipped in the app; goes away with an Expo SDK upgrade.

peerDependencyRules:
  allowedVersions:
    # @elastic/transport → @opentelemetry/core wants api <1.10; vitest already brings 1.10
    # (1.x is backward compatible). Drop once @opentelemetry/core allows 1.10.
    '@opentelemetry/core>@opentelemetry/api': '1.10'

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  'esbuild': true
  'prisma': true
