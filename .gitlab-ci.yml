# GitLab CI for the GitFlow branching model (mirrors .github/workflows).
#
#   Branches            Pipeline
#   ------------------  ---------------------------------------------------------
#   MR (any)            gitflow (source → target allowed?) + check + e2e
#   feature/*, fix/*…   check
#   develop             check → images (dev, automatic)
#   release/X.Y.Z       check → images (stg, automatic)
#   hotfix/X.Y.Z        check → images (stg, automatic)
#   main                check
#   tag vX.Y.Z on main  check → images (prod, manual) tagged :prod :X.Y.Z :latest
#
#   check  – format, build, lint, type-check, test; migrations apply on a fresh
#            Postgres and match schema.prisma.
#   images – api, migrate, socket, web → ${REGISTRY_IMAGE}/<app>:<env> + :<short sha>
#
# CI/CD variables (Settings → CI/CD → Variables):
#   REGISTRY_IMAGE / REGISTRY_HOST / REGISTRY_USER / REGISTRY_PASSWORD
#     Optional: push somewhere other than this project's GitLab registry.
#   PUBLIC_API_URL / PUBLIC_SOCKET_URL
#     Browser URLs baked into the web image. Scope them per environment
#     (dev / stg / prod) – image jobs declare `environment` for that.
#   Environments: docs/process/environments.md
#
# Recommended: protect main, develop, release/*, hotfix/* and tags v*.

stages:
  - check
  - images

variables:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.25.0'
  # Default: this project's GitLab Container Registry
  REGISTRY_IMAGE: ${CI_REGISTRY_IMAGE}
  REGISTRY_HOST: ${CI_REGISTRY}
  REGISTRY_USER: ${CI_REGISTRY_USER}
  REGISTRY_PASSWORD: ${CI_REGISTRY_PASSWORD}

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Work branches with an open MR already get the MR pipeline
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH !~ /^(main|develop|release\/.+|hotfix\/.+)$/
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ==================== CHECK ====================

gitflow:
  stage: check
  image: alpine:3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - sh scripts/gitflow-check.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

check:
  stage: check
  image: node:${NODE_VERSION}-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:8-alpine
      alias: redis
  variables:
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    DATABASE_URL: postgresql://app:app@postgres:5432/app?schema=public
    REDIS_URL: redis://redis:6379
    PRISMA_HIDE_UPDATE_MESSAGE: '1'
    TURBO_TELEMETRY_DISABLED: '1'
    HUSKY: '0'
  before_script:
    - apk add --no-cache libc6-compat git
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile
  script:
    - pnpm format:check
    - pnpm turbo run build lint check-types test
    - pnpm db:deploy
    - pnpm db:check
    # Backend e2e: api on <db>_test, socket over a real port
    - pnpm turbo run test:e2e --filter=api --filter=socket --filter=@repo/redis

# Browser e2e: Playwright starts api, socket and web against Postgres + Redis.
# Debian image: Playwright's browser dependencies need apt.
e2e:
  stage: check
  image: node:${NODE_VERSION}-bookworm
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:8-alpine
      alias: redis
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  variables:
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    DATABASE_URL: postgresql://app:app@postgres:5432/app?schema=public
    REDIS_URL: redis://redis:6379
    # Uploads are mocked in the browser test; the api only needs valid config
    STORAGE_CORE_S3_SERVERS: '[{"NAME":"default","CONFIG":{"ENDPOINT":"http://storage.test","KEY":"test","SECRET":"test-secret"}}]'
    STORAGE_BUCKET: test
    PRISMA_HIDE_UPDATE_MESSAGE: '1'
    TURBO_TELEMETRY_DISABLED: '1'
    HUSKY: '0'
  before_script:
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile
    - pnpm --filter e2e install-browsers
  script:
    - pnpm db:deploy
    - pnpm turbo run test:e2e --filter=e2e
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths: [apps/e2e/playwright-report]

# ==================== IMAGES ====================

.build-image:
  stage: images
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: '1'
    # Space-separated tags added on top of :<env> and :<short sha>
    EXTRA_TAGS: ''
  needs: [check, e2e]
  parallel:
    matrix:
      - APP: [api, migrate, socket, web]
  environment:
    name: ${BUILD_STAGE}
    # Only scopes variables to the environment; deployment happens elsewhere
    action: prepare
  before_script:
    - echo "${REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USER}" --password-stdin "${REGISTRY_HOST}"
  script:
    - |
      case "${APP}" in
        web)     FILE=deploy/web.Dockerfile;  TARGET=runner;  WORKSPACE=web ;;
        migrate) FILE=deploy/nest.Dockerfile; TARGET=migrate; WORKSPACE=api ;;
        *)       FILE=deploy/nest.Dockerfile; TARGET=runner;  WORKSPACE=${APP} ;;
      esac
    - IMAGE="${REGISTRY_IMAGE}/${APP}"
    - TAGS="${BUILD_STAGE} ${CI_COMMIT_SHORT_SHA} ${EXTRA_TAGS}"
    - TAG_ARGS=""; for t in ${TAGS}; do TAG_ARGS="${TAG_ARGS} -t ${IMAGE}:${t}"; done
    - docker pull "${IMAGE}:${BUILD_STAGE}" || true
    - >
      docker build
      --platform=linux/amd64
      --progress=plain
      -f "${FILE}"
      --target "${TARGET}"
      --build-arg APP="${WORKSPACE}"
      --build-arg NEXT_PUBLIC_API_URL="${PUBLIC_API_URL:-http://localhost:4000/api}"
      --build-arg NEXT_PUBLIC_SOCKET_URL="${PUBLIC_SOCKET_URL:-http://localhost:4001}"
      --build-arg NEXT_PUBLIC_APP_ENV="${BUILD_STAGE}"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from "${IMAGE}:${BUILD_STAGE}"
      ${TAG_ARGS}
      .
    - for t in ${TAGS}; do docker push "${IMAGE}:${t}"; done
    - 'echo -e "\e[1;96m${BUILD_STAGE}: pushed ${IMAGE} [${TAGS}]\e[0m"'
  after_script:
    - docker image prune -f

images:dev:
  extends: .build-image
  variables:
    BUILD_STAGE: dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"

images:stg:
  extends: .build-image
  variables:
    BUILD_STAGE: stg
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(release|hotfix)\/\d+\.\d+\.\d+$/

images:prod:
  extends: .build-image
  variables:
    BUILD_STAGE: prod
    # Full history to check the tag is on main
    GIT_DEPTH: '0'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  before_script:
    - apk add --no-cache git
    - git fetch --quiet origin "${CI_DEFAULT_BRANCH}"
    - |
      git merge-base --is-ancestor "${CI_COMMIT_SHA}" "origin/${CI_DEFAULT_BRANCH}" || {
        echo "✖ ${CI_COMMIT_TAG} is not on ${CI_DEFAULT_BRANCH}; tag releases after merging release/* or hotfix/*." >&2
        exit 1
      }
    - export EXTRA_TAGS="${CI_COMMIT_TAG#v} latest"
    - echo "${REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USER}" --password-stdin "${REGISTRY_HOST}"

# ==================== RENOVATE ====================
# Dependency update MRs (config: renovate.json5). Setup:
#   1. Project/group access token "renovate" (role Developer, scopes api + write_repository)
#      → CI/CD variable RENOVATE_TOKEN (masked, protected).
#   2. Optional: GITHUB_COM_TOKEN (read-only PAT) so changelogs from github.com load.
#   3. Build → Pipeline schedules on develop, timezone Asia/Ho_Chi_Minh:
#        recommended  `0 7 * * *` (daily): update MRs still only open Monday
#                     (renovate.json5 `schedule`), security MRs within a day.
#        weekly only  `0 7 * * 1`: must fall inside `before 9am on monday`,
#                     security MRs may wait up to 7 days.

renovate:
  stage: check
  image: renovate/renovate:44
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: ${CI_API_V4_URL}
    RENOVATE_REPOSITORIES: ${CI_PROJECT_PATH}
    LOG_LEVEL: info
  script:
    - renovate
